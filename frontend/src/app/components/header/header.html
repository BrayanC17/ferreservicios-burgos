<div class="topbar">
  <div class="contenedor topbar__fila">
    <span>Cra. 93 #22-11, Fontibón · Bogotá D.C.</span>
    <span>WhatsApp: 324 6196174 · Horario: L-S 7:00 AM - 6:00 PM</span>
  </div>
</div>

<!-- Encabezado con logo, buscador y acciones -->
<header class="cabecera">
  <div class="contenedor cabecera__fila">
    <a class="logo" href="/" aria-label="Ferreservicios Burgos, ir al inicio">
      <span class="logo__marca">
        <svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="#7DDBA3" stroke-width="2" stroke-linejoin="round" aria-hidden="true">
          <path d="M12 2l8.5 5v10L12 22l-8.5-5V7z" />
          <circle cx="12" cy="12" r="3.2" />
        </svg>
      </span>
      <span class="logo__texto">
        <span class="logo__nombre">Ferreservicios</span>
        <span class="logo__sub">BURGOS 22</span>
      </span>
    </a>

    <form class="buscador" role="search" (submit)="$event.preventDefault()">
      <select class="buscador__categoria" aria-label="Categoría">
        <option>Todas</option>
        <option>Herramienta</option>
        <option>Eléctricos</option>
        <option>PVC y Canaletas</option>
      </select>
      <input
        class="buscador__campo"
        type="search"
        aria-label="Buscar productos"
        placeholder="Busca por producto, marca o referencia (ej. taladro, cinta aislante)"
      />
      <button class="buscador__boton" type="submit" aria-label="Buscar">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#0B2A4A" stroke-width="2.2" stroke-linecap="round" aria-hidden="true">
          <circle cx="11" cy="11" r="7" />
          <path d="M20 20l-4-4" />
        </svg>
        Buscar
      </button>
    </form>

    <div class="acciones">
      <a class="acciones__servicios" href="#">
        <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#0B2A4A" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <path d="M14.7 6.3a4 4 0 0 0-5.4 5.4L3 18l3 3 6.3-6.3a4 4 0 0 0 5.4-5.4l-2.6 2.6-2.4-.6-.6-2.4z" />
        </svg>
        Servicios
      </a>
      <a class="acciones__cotizar" href="#">
        <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#FFFFFF" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <path d="M3 4h2l2.5 11h11L21 7H6.5" />
          <circle cx="9" cy="20" r="1" />
          <circle cx="17" cy="20" r="1" />
        </svg>
        Mi cotización
        <span class="acciones__contador">0</span>
      </a>
    </div>

  </div>
</header>

<!-- Menú principal -->
<nav class="menu" aria-label="Principal">
  <div class="contenedor menu__fila">
    <a class="menu__categorias" href="#">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#0B2A4A" stroke-width="2.2" stroke-linecap="round" aria-hidden="true">
        <path d="M4 7h16M4 12h16M4 17h16" />
      </svg>
      Todas las categorías
    </a>
    <a class="menu__enlace menu__enlace--activo" href="/">Inicio</a>
    <a class="menu__enlace" href="#">Catálogo</a>
    <a class="menu__enlace" href="#">Más demandados</a>
    <a class="menu__enlace" href="#">Servicios</a>
    <a class="menu__enlace" href="#">Nosotros</a>
    <a class="menu__enlace" href="#">Contacto</a>
  </div>
</nav>
